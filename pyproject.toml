[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-deepfake-detection-system"
version = "0.1.0"
description = "Research prototype for explainable deepfake image detection"
requires-python = ">=3.11,<3.12"
dynamic = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
