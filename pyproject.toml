[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "explainable-deepfake-detection"
version = "0.1.0"
description = "Dataset infrastructure for explainable deepfake detection research"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
inspection = ["Pillow>=10.2,<10.3"]
extraction = ["opencv-python>=4.8,<4.12", "facenet-pytorch==2.6.0"]

[project.scripts]
deepfake-inventory = "deepfake_data.inventory:main"
deepfake-split = "deepfake_data.split:main"
deepfake-extract = "deepfake_data.extract:main"
deepfake-inspect = "deepfake_data.inspect_media:main"
deepfake-gif = "deepfake_data.gif_frames:main"
deepfake-training-manifest = "deepfake_data.training_manifest:main"
deepfake-baseline-eval = "deepfake_data.baseline_eval:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
